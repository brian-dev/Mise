[project]
name = "mise-ai"
version = "0.0.0"
description = "Mise AI service — meal-plan/recipe generation and pricing (FastAPI + Claude)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.40",
    "supabase>=2.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mise_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI's Depends()/Header() in argument defaults is the framework idiom.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Exclude live (paid, real-Claude) tests by default so `pytest` and CI are fast
# and free. Run them explicitly with `uv run pytest -m live`.
addopts = "-m 'not live'"
markers = [
    "live: hits the real Claude API; requires a non-empty ANTHROPIC_API_KEY",
    "db: requires a reachable Postgres (local Supabase stack)",
]
